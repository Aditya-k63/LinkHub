name: linkhub

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://linkhub:linkhub@postgres:5432/linkhub
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: local-development-secret-key-change-me-0123456789
      SECRET_KEY: local-development-secret-key-change-me-0123456789
      BASE_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - linkhub-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkhub
      POSTGRES_PASSWORD: linkhub
      POSTGRES_DB: linkhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkhub -d linkhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - linkhub-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - linkhub-network

  worker:
    build: .
    command: ["python", "-m", "app.workers.consumer"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://linkhub:linkhub@postgres:5432/linkhub
      REDIS_URL: redis://redis:6379/0
      CLICK_WRITE_MODE: async
      JWT_SECRET_KEY: local-development-secret-key-change-me-0123456789
      SECRET_KEY: local-development-secret-key-change-me-0123456789
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - worker
    restart: unless-stopped
    networks:
      - linkhub-network

volumes:
  postgres_data:
  redis_data:

networks:
  linkhub-network:
    driver: bridge

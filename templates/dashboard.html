{% extends "base.html" %}
{% block title %}Dashboard - {{ app_name }}{% endblock %}

{% block content %}
<main class="dashboard">
    <div class="container">
        <h1>Your Links</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Links</h3>
                <p id="total-links">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Clicks</h3>
                <p id="total-clicks">0</p>
            </div>
            <div class="stat-card">
                <h3>Active Links</h3>
                <p id="active-links">0</p>
            </div>
        </div>

        <div class="links-section">
            <div class="toolbar">
                <input type="search" id="search-input" placeholder="Filter by code or URL...">
                <button type="button" id="refresh-btn">Refresh</button>
            </div>
            <div id="links-list" class="links-section">
                <div class="empty">Loading...</div>
            </div>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/dashboard.js"></script>
{% endblock %}

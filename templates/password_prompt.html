<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected link - {{ app_name }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; color: #f8fafc;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
        }
        .card {
            background: #1e293b; padding: 2rem; border-radius: 12px;
            width: 100%; max-width: 380px;
        }
        h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin: 0 0 1.5rem; }
        code { color: #6366f1; }
        input {
            width: 100%; padding: 0.75rem 1rem; margin-bottom: 1rem;
            border: 2px solid #334155; border-radius: 8px;
            background: #0f172a; color: #f8fafc; font-size: 1rem;
        }
        input:focus { outline: none; border-color: #6366f1; }
        button {
            width: 100%; padding: 0.75rem; background: #6366f1; color: #fff;
            border: none; border-radius: 8px; font-size: 1rem;
            font-weight: 600; cursor: pointer;
        }
        button:hover { background: #4f46e5; }
        .error { color: #ef4444; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>This link is password protected</h1>
        <p>Enter the password to continue to <code>{{ short_code }}</code>.</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="get" action="/{{ short_code }}">
            <input type="password" name="password" placeholder="Password" autofocus required>
            <button type="submit">Unlock</button>
        </form>
    </div>
</body>
</html>
